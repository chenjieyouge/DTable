<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DTable · 百万级真实数据实测</title>
    <style>
      :root {
        --primary: #1677ff;
        --primary-hover: #4096ff;
        --primary-bg: rgba(22, 119, 255, 0.1);
        --text-primary: #1d2129;
        --text-secondary: #4e5969;
        --text-muted: #86909c;
        --border: #e5e6eb;
        --border-light: #f2f3f5;
        --bg: #ffffff;
        --bg-subtle: #f7f8fa;
        --danger: #f53f3f;
        --success: #00b42a;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: var(--bg-subtle);
        color: var(--text-primary);
        padding: 24px;
        font-size: 14px;
        line-height: 1.5;
      }

      .wrap { max-width: 1600px; margin: 0 auto; }

      .page-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
      .page-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }

      .card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }

      /* ---- 模式切换 ---- */
      .modes { display: flex; gap: 12px; }

      .mode {
        flex: 1;
        text-align: left;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      .mode:hover { border-color: var(--primary-hover); }
      .mode.active {
        border-color: var(--primary);
        background: var(--primary-bg);
        box-shadow: 0 0 0 1px var(--primary) inset;
      }
      .mode-name { font-weight: 600; font-size: 14px; display: block; margin-bottom: 2px; }
      .mode.active .mode-name { color: var(--primary); }
      .mode-desc { color: var(--text-muted); font-size: 12px; }

      /* ---- 控制条 ---- */
      .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      .bar-label { color: var(--text-secondary); font-size: 13px; }

      select, input[type='text'], input[type='number'] {
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
        color: var(--text-primary);
        background: var(--bg);
      }
      select:focus, input:focus { outline: none; border-color: var(--primary); }

      button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
      }
      button:hover { border-color: var(--primary); color: var(--primary); }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ---- 状态指标 ---- */
      .stats { display: flex; gap: 32px; flex-wrap: wrap; }
      .stat-label { color: var(--text-muted); font-size: 12px; display: block; }
      .stat-value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

      /* ---- 进度条 ---- */
      .progress {
        height: 3px;
        background: var(--border-light);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 12px;
        display: none;
      }
      .progress.on { display: block; }
      .progress-fill {
        height: 100%;
        width: 0;
        background: var(--primary);
        transition: width 0.1s linear;
      }

      /* ---- 提示条 ---- */
      .note {
        display: none;
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 13px;
        border-left: 3px solid var(--primary);
        background: var(--primary-bg);
        color: var(--text-secondary);
      }
      .note.on { display: block; }
      .note.err { border-left-color: var(--danger); background: rgba(245, 63, 63, 0.08); color: var(--danger); }
      .note.ok { border-left-color: var(--success); background: rgba(0, 180, 42, 0.08); color: var(--text-secondary); }

      /* ---- 表格容器 ---- */
      #table-container { min-height: 560px; }

      .tip { color: var(--text-muted); font-size: 12px; margin-top: 16px; }
      .tip code {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="page-title">DTable · 百万级真实数据实测</h1>
      <p class="page-sub">
        数据源：门店零售明细 1,048,575 行 × 13 列，全中文列名。
        Client 模式读本地 CSV，Server 模式走 MySQL。
      </p>

      <!-- 模式切换 -->
      <div class="card">
        <div class="modes">
          <button class="mode active" data-mode="client">
            <span class="mode-name">Client 模式</span>
            <span class="mode-desc">浏览器内加载 CSV，排序/筛选全在前端内存完成</span>
          </button>
          <button class="mode" data-mode="server">
            <span class="mode-name">Server 模式</span>
            <span class="mode-desc">MySQL 分页查询，排序/筛选/汇总由后端完成</span>
          </button>
        </div>
      </div>

      <!-- 控制条 -->
      <div class="card">
        <div class="bar" id="bar-client">
          <span class="bar-label">加载行数</span>
          <select id="client-rows">
            <option value="100000">10 万</option>
            <option value="200000" selected>20 万</option>
            <option value="500000">50 万</option>
            <option value="1048575">全部 104 万（约占 1GB 内存）</option>
          </select>
          <button class="primary" id="btn-client-load">加载</button>
        </div>

        <div class="bar" id="bar-server" style="display: none">
          <span class="bar-label">每页行数</span>
          <select id="server-page-size">
            <option value="100">100</option>
            <option value="200" selected>200</option>
            <option value="500">500</option>
            <option value="1000">1000</option>
          </select>
          <button class="primary" id="btn-server-load">加载</button>
          <span style="width: 12px"></span>
          <button id="btn-server-reset">重置查询</button>
        </div>

        <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="note" id="note"></div>
      </div>

      <!-- 指标 -->
      <div class="card">
        <div class="stats">
          <div>
            <span class="stat-label">当前模式</span>
            <span class="stat-value" id="stat-mode">—</span>
          </div>
          <div>
            <span class="stat-label">数据总量</span>
            <span class="stat-value" id="stat-total">—</span>
          </div>
          <div>
            <span class="stat-label">加载耗时</span>
            <span class="stat-value" id="stat-load">—</span>
          </div>
          <div>
            <span class="stat-label">解析耗时</span>
            <span class="stat-value" id="stat-parse">—</span>
          </div>
          <div>
            <span class="stat-label">首次渲染</span>
            <span class="stat-value" id="stat-render">—</span>
          </div>
          <div>
            <span class="stat-label">堆内存</span>
            <span class="stat-value" id="stat-mem">—</span>
          </div>
        </div>
      </div>

      <!-- 表格 -->
      <div class="card" style="padding: 0; overflow: hidden">
        <div id="table-container"></div>
      </div>

      <p class="tip">
        Server 模式需要先启动后端：<code>cd server &amp;&amp; go run .</code>（监听 8080，vite 已配好 /api 代理）。
        列头漏斗图标是筛选，点列头可排序。<code>pnpm dev</code> 下若 5173 被占用会顺延端口。
      </p>
    </div>

    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
